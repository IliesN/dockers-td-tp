name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and test with Maven
        run: mvn -B clean verify
        working-directory: TP_DOCKERS_1/backend-api/simpleapi

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: TP_DOCKERS_1/database
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-database:latest
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: TP_DOCKERS_1/backend-api/simpleapi
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-backend:latest
      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: TP_DOCKERS_1/http-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-httpd:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible and the Docker collection
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Run playbook
        working-directory: TP_DOCKERS_3/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i inventories/setup.yml playbook.yml -e ansible_ssh_private_key_file=~/.ssh/id_rsa
