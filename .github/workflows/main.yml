name: CI devops 2025

on:
  # Run the pipeline on every push to main and develop
  push:
    branches: [main, develop]
  # ...and on every pull request
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Get the repository code
      - uses: actions/checkout@v4

      # Install Java 21 (the version used by the backend)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Clean, build, and run unit + integration tests
      # (Testcontainers starts a PostgreSQL container for the integration tests)
      - name: Build and test with Maven
        run: mvn -B clean verify --file backend-api/simpleapi/pom.xml